<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Privilege card – OneSpark</title><link rel="stylesheet" href="style.css"><body><header class="site-header"><a class="site-brand" href="../index.html">OneSpark</a><nav class="site-nav" aria-label="Main navigation"><a href="../index.html">Home</a><a href="../about.html">About</a><a href="./index.html" aria-current="page">Privilege card</a></nav></header><main><section id="gate" class="gate"><div class="seal">♡</div><p class="eyebrow">A LITTLE PROMISE, JUST FOR YOU</p><h1>把偏爱，<br>存进每一天。</h1><p class="muted">这里收藏着只属于你的特权与我们的小小约定。</p><form id="login"><label for="password">我们的秘密口令</label><div class="row"><input id="password" type="password" autocomplete="current-password" required placeholder="输入口令，打开卡包"><button>解锁 ♡</button></div></form><p id="message" role="status"></p><label class="file">导入加密卡包 / 备份<input id="import" type="file" accept=".json,application/json" hidden></label><p class="tiny">记录保存在当前浏览器。换设备前，记得导出加密备份。</p></section><section id="wallet" hidden><div class="hero"><p class="eyebrow">LOVE IS IN THE LITTLE THINGS</p><h1 id="heading"></h1><p id="subtitle"></p><div class="stats"><div><strong id="available">0</strong><span>份待兑现的偏爱</span></div><div><strong id="used">0</strong><span>次温柔的回忆</span></div></div></div><nav><div class="tabs"><button data-tab="all" class="active">全部卡片</button><button data-tab="ready">待使用</button><button data-tab="history">使用记录</button></div><div class="tools"><button id="settings">卡包设置</button><button id="export">加密备份 ↓</button><button id="lock">锁定</button></div></nav><input id="search" type="search" placeholder="寻找一份偏爱…" aria-label="搜索卡片"><p id="notice" class="tiny" role="status"></p><div id="cards" class="grid"></div><div id="history"></div><footer>每一张小小的卡片，都是认真许下的约定。<br><span id="rules"></span></footer></section></main><dialog id="modal"><form id="editor"><h2 id="modalTitle"></h2><div id="fields"></div><p id="modalError" role="alert"></p><div class="row"><button type="button" id="cancel" class="secondary">再想想</button><button id="confirm">保存</button></div></form></dialog><script src="crypto.js"></script><script src="app.js"></script></body></html>
